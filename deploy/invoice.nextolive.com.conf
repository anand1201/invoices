# Apache vhost for invoice.nextolive.com
#
# Install as /etc/apache2/sites-available/invoice.nextolive.com.conf
# then: sudo a2ensite invoice.nextolive.com && sudo apachectl configtest
#
# This is a NEW file. It must not replace or edit any existing vhost.
# `000-default.conf` sorts first alphabetically and therefore remains Apache's
# default vhost for unmatched hostnames — adding this one does not steal it.
#
# certbot --apache will generate invoice.nextolive.com-le-ssl.conf from this,
# matching the convention the other sites on this box already use.

<VirtualHost *:80>
    ServerName invoice.nextolive.com

    # Everything — API and the built React client — is served by the single
    # Node process that PM2 runs on 127.0.0.1:4700.
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 60

    ProxyPass        / http://127.0.0.1:4700/
    ProxyPassReverse / http://127.0.0.1:4700/

    # Let Express (app.set('trust proxy', 1)) see the real scheme and client IP
    # so the email rate limiter keys on the visitor, not on Apache.
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port  "80"

    ErrorLog  ${APACHE_LOG_DIR}/invoice.nextolive.com-error.log
    CustomLog ${APACHE_LOG_DIR}/invoice.nextolive.com-access.log combined
</VirtualHost>
